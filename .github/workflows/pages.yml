# The catalog is only worth maintaining if it gets opened, and nothing on
# localhost:6006 gets opened. This is what turns it into a URL.
name: pages
on:
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build-storybook
      # Pages has to be switched on out of band — the workflow token can create
      # a deployment but not the site itself ("Resource not accessible by
      # integration"). One `gh api -X POST .../pages -f build_type=workflow`,
      # or Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: storybook-static }
      - id: deploy
        uses: actions/deploy-pages@v4
